<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .title { font: 700 36px Arial, Helvetica, sans-serif; fill: #20252b; }
      .subtitle { font: 400 19px Arial, Helvetica, sans-serif; fill: #626a73; }
      .setting { font: 700 22px Arial, Helvetica, sans-serif; fill: #20252b; }
      .kicker { font: 700 15px Arial, Helvetica, sans-serif; fill: #626a73; }
      .box-title { font: 700 25px Arial, Helvetica, sans-serif; fill: #20252b; }
      .box-text { font: 400 18px Arial, Helvetica, sans-serif; fill: #303840; }
      .box-note { font: 400 16px Arial, Helvetica, sans-serif; fill: #626a73; }
      .assessment-title { font: 700 26px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .assessment-text { font: 400 18px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .scope { font: 400 16px Arial, Helvetica, sans-serif; fill: #4d5760; }
      .line { stroke: #69737c; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#69737c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#ffffff"/>

  <text x="90" y="75" class="title">Conceptual and Empirical Framework</text>
  <text x="90" y="110" class="subtitle">Connecting modeled flood exposure, socio-economic vulnerability, and protection-related outcomes</text>

  <rect x="120" y="145" width="1360" height="78" rx="6" fill="#dde8ec" stroke="#8da5af" stroke-width="2"/>
  <text x="800" y="193" text-anchor="middle" class="setting">Municipality-level analysis in the RP500-defined Elbe flood corridor (n = 835)</text>

  <g id="physical-exposure">
    <rect x="90" y="285" width="430" height="330" rx="6" fill="#f2f8f8" stroke="#1b6a73" stroke-width="3"/>
    <text x="125" y="325" class="kicker">PHYSICAL LAYER</text>
    <text x="125" y="365" class="box-title">Modeled Flood Exposure</text>
    <text x="125" y="415" class="box-text">• EFAS/JRC flood extents for RP10–RP500</text>
    <text x="125" y="455" class="box-text">• RP100 flooded share of municipal area</text>
    <text x="125" y="495" class="box-text">• RP100 flooded share of Artificial Land</text>
    <text x="125" y="535" class="box-text">• exposure curves across return periods</text>
    <text x="125" y="580" class="box-note">Artificial Land refines the area measure, but is</text>
    <text x="125" y="605" class="box-note">not direct population or building exposure.</text>
  </g>

  <g id="social-vulnerability">
    <rect x="585" y="285" width="430" height="330" rx="6" fill="#fff7f2" stroke="#b55432" stroke-width="3"/>
    <text x="620" y="325" class="kicker">SOCIAL LAYER</text>
    <text x="620" y="365" class="box-title">Socio-Economic Vulnerability</text>
    <text x="620" y="415" class="box-text">• 23 screened municipality-level INKAR indicators</text>
    <text x="620" y="455" class="box-text">• demographic and household structure</text>
    <text x="620" y="495" class="box-text">• deprivation and labour-market position</text>
    <text x="620" y="535" class="box-text">• access and adaptive capacity</text>
    <text x="620" y="580" class="box-note">The main index balances the three dimensions;</text>
    <text x="620" y="605" class="box-note">PCA is used as a diagnostic and sensitivity test.</text>
  </g>

  <g id="protection-loss">
    <rect x="1080" y="285" width="430" height="330" rx="6" fill="#f5f6f8" stroke="#5f6f82" stroke-width="3"/>
    <text x="1115" y="325" class="kicker">OUTCOME LAYER</text>
    <text x="1115" y="365" class="box-title">Modeled Protection/Loss Outcomes</text>
    <text x="1115" y="415" class="box-text">• positive-loss versus no-event status</text>
    <text x="1115" y="455" class="box-text">• modeled annual loss probability</text>
    <text x="1115" y="495" class="box-text">• finite protection return periods for</text>
    <text x="1137" y="525" class="box-text">280 positive-loss municipalities</text>
    <text x="1115" y="570" class="box-note">These are simulation-based outcomes, not an</text>
    <text x="1115" y="595" class="box-note">inventory of individual dikes or flood walls.</text>
  </g>

  <path d="M305 615 L445 690" class="line"/>
  <path d="M800 615 L800 690" class="line"/>
  <path d="M1295 615 L1155 690" class="line"/>

  <g id="assessment">
    <rect x="250" y="700" width="1100" height="138" rx="6" fill="#1b6a73"/>
    <text x="800" y="745" text-anchor="middle" class="assessment-title">Distributive Flood-Justice Assessment</text>
    <text x="800" y="783" text-anchor="middle" class="assessment-text">Compare physical exposure and modeled protection/loss outcomes across vulnerability profiles</text>
    <text x="800" y="815" text-anchor="middle" class="assessment-text">and identify municipalities where high exposure, vulnerability, and residual risk overlap.</text>
  </g>

  <rect x="180" y="885" width="1240" height="72" rx="6" fill="#f4f6f7" stroke="#c5ccd2" stroke-width="2"/>
  <text x="800" y="915" text-anchor="middle" class="scope">Interpretive scope: descriptive municipality-level associations, not causal evidence of policy intent.</text>
  <text x="800" y="942" text-anchor="middle" class="scope">Municipal aggregation, model coverage, and the limited representation of smaller streams remain explicit boundaries.</text>
</svg>
