<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .title { font: 600 32px Georgia, 'Times New Roman', serif; fill: #1f1f1f; letter-spacing: 0.2px; }
      .subtitle { font: 400 17px Georgia, 'Times New Roman', serif; fill: #666666; letter-spacing: 0.15px; }
      .box-title { font: 700 24px Georgia, 'Times New Roman', serif; fill: #1f1f1f; }
      .box-text { font: 400 18px Georgia, 'Times New Roman', serif; fill: #2e2e2e; }
      .small { font: 400 16px Georgia, 'Times New Roman', serif; fill: #505050; }
      .arrow-label { font: 600 16px Georgia, 'Times New Roman', serif; fill: #4d4d4d; }
      .caption { font: 400 16px Georgia, 'Times New Roman', serif; fill: #555555; }
      .frame { fill: #fcfcfb; stroke: #d8d8d4; stroke-width: 2; }
      .banner { fill: #f7f8f8; stroke: #b9c0c4; stroke-width: 2; }
      .hazard { fill: #f8fafb; stroke: #8b99a1; stroke-width: 2.2; }
      .exposure { fill: #fbfaf8; stroke: #9e9388; stroke-width: 2.2; }
      .social { fill: #f8faf7; stroke: #8f9789; stroke-width: 2.2; }
      .protect { fill: #faf9fc; stroke: #9a97a8; stroke-width: 2.2; }
      .assessment { fill: #f7f8fa; stroke: #8d96a3; stroke-width: 2.2; }
      .solid { stroke: #4f4f4f; stroke-width: 3.6; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .dashed { stroke: #7c7d85; stroke-width: 3.6; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow-soft); stroke-linecap: round; stroke-linejoin: round; }
      .fine { stroke: #d2d2cd; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4f4f4f"/>
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7c7d85"/>
    </marker>
  </defs>

  <rect id="frame" x="20" y="20" width="1560" height="940" rx="22" class="frame"/>

  <g id="header">
    <text x="90" y="90" class="title">Conceptual Model of the Study</text>
    <text x="90" y="124" class="subtitle">How hazard, exposure, vulnerability, and protection are linked in a municipality-level distributive assessment</text>
  </g>

  <g id="study-setting">
    <rect x="150" y="165" width="1300" height="78" rx="18" class="banner"/>
    <text x="215" y="212" class="box-title">Study setting: municipality-level analysis in the Elbe flood corridor</text>
  </g>

  <g id="hazard">
    <rect x="110" y="330" width="360" height="198" rx="20" class="hazard"/>
    <text x="145" y="386" class="box-title">Flood Hazard</text>
    <text x="145" y="430" class="box-text">- flood intensity and extent across</text>
    <text x="165" y="460" class="box-text">different return periods</text>
    <text x="145" y="492" class="box-text">- physical flood potential in the corridor</text>
    <text x="145" y="528" class="small">hazard exists independently of social conditions</text>
  </g>

  <g id="protection">
    <rect x="745" y="150" width="360" height="130" rx="20" class="protect"/>
    <text x="778" y="204" class="box-title">Flood Protection</text>
    <text x="778" y="238" class="box-text">- modifies how hazard becomes exposure</text>
    <text x="778" y="268" class="small">reduces frequent impacts, but not all risk</text>
  </g>

  <g id="exposure">
    <rect x="565" y="330" width="470" height="220" rx="20" class="exposure"/>
    <text x="600" y="386" class="box-title">Flood Exposure</text>
    <text x="600" y="430" class="box-text">- share of municipal area affected by flooding</text>
    <text x="600" y="462" class="box-text">- realized spatial exposure at municipality level</text>
    <text x="600" y="494" class="box-text">- can vary across return periods and locations</text>
    <text x="600" y="530" class="small">central empirical expression of flood-related outcomes</text>
  </g>

  <g id="vulnerability">
    <rect x="180" y="655" width="420" height="205" rx="20" class="social"/>
    <text x="215" y="711" class="box-title">Socio-Economic Vulnerability</text>
    <text x="215" y="755" class="box-text">- multidimensional social and demographic</text>
    <text x="235" y="785" class="box-text">conditions at municipality level</text>
    <text x="215" y="817" class="box-text">- shapes sensitivity and adaptive capacity</text>
    <text x="215" y="853" class="small">social differentiation of flood-related disadvantage</text>
  </g>

  <g id="assessment">
    <rect x="1125" y="470" width="350" height="215" rx="20" class="assessment"/>
    <text x="1160" y="526" class="box-title">Distributive Assessment</text>
    <text x="1160" y="570" class="box-text">- compare the geography of exposure</text>
    <text x="1180" y="600" class="box-text">with the geography of vulnerability</text>
    <text x="1160" y="632" class="box-text">- identify whether flood-related outcomes</text>
    <text x="1180" y="662" class="box-text">and protection benefits are unevenly distributed</text>
  </g>

  <g id="arrows">
    <path d="M470 430 C520 430, 535 438, 565 440" class="solid"/>
    <text x="472" y="398" class="arrow-label">hazard translated into exposure</text>

    <path d="M925 280 C925 300, 920 312, 900 330" class="dashed"/>
    <text x="944" y="314" class="arrow-label">modifies realized exposure</text>

    <path d="M1035 440 C1085 440, 1095 520, 1125 565" class="solid"/>
    <text x="1035" y="412" class="arrow-label">observed flood-related outcome</text>

    <path d="M600 760 C820 820, 1015 765, 1125 650" class="solid"/>
    <text x="775" y="875" class="arrow-label">social interpretation of flood outcomes</text>

    <path d="M1105 235 C1225 260, 1280 345, 1300 470" class="dashed"/>
    <text x="1220" y="330" class="arrow-label">shapes residual risk and benefit distribution</text>
  </g>

  <line x1="90" y1="885" x2="1510" y2="885" class="fine"/>
  <text x="90" y="918" class="caption">Figure 3.1. Conceptual model of the study. Flood hazard creates the physical potential for inundation, while flood exposure captures how this hazard is realized at municipality level. Socio-economic vulnerability represents the social conditions that shape sensitivity and adaptive capacity, and flood protection modifies how physical hazard is translated into realized exposure and residual risk. The study evaluates these dimensions through a distributive perspective that compares the geography of exposure and protection-related benefits with the geography of socio-economic vulnerability.</text>
</svg>
